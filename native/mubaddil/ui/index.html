<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مُبَدِل — Mubaddil</title>
<style>
@font-face { font-family: "Plex Arabic"; font-weight: 400; src: url("fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Plex Arabic"; font-weight: 500; src: url("fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Plex Arabic"; font-weight: 600; src: url("fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Plex Arabic"; font-weight: 400; src: url("fonts/ibm-plex-sans-arabic-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
@font-face { font-family: "Plex Arabic"; font-weight: 500; src: url("fonts/ibm-plex-sans-arabic-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
@font-face { font-family: "Plex Arabic"; font-weight: 600; src: url("fonts/ibm-plex-sans-arabic-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }

:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface: #ffffff;
  --surface-2: #f8f8f6;
  --ink: #18181b;
  --muted: #63636b;
  --line: #e6e5e1;
  --accent: #166534;
  --accent-ink: #ffffff;
  --accent-soft: #e4f0e8;
  --accent-text: #14532d;
  --knob: #ffffff;
  --track-off: #c9c8c3;
  --shadow: 0 1px 2px rgba(24, 24, 20, 0.05), 0 8px 24px -12px rgba(24, 24, 20, 0.12);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121313;
    --surface: #1b1c1c;
    --surface-2: #222423;
    --ink: #f2f2f0;
    --muted: #a3a3a0;
    --line: #2c2e2d;
    --accent: #3fa36b;
    --accent-ink: #0b1a11;
    --accent-soft: rgba(63, 163, 107, 0.14);
    --accent-text: #8fd3aa;
    --knob: #f2f2f0;
    --track-off: #474947;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px -14px rgba(0, 0, 0, 0.6);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Plex Arabic", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  overflow-y: auto;
  overflow-x: hidden;
}
.app { max-width: 560px; margin: 0 auto; padding: 22px 20px 18px; display: grid; gap: 14px; }

/* Header */
.top { display: flex; align-items: center; gap: 12px; }
.mark { width: 40px; height: 40px; border-radius: 11px; flex: none; box-shadow: 0 2px 6px -2px rgba(22, 101, 52, 0.45); }
.brand { display: grid; line-height: 1.2; }
.brand b { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 12.5px; }
.lang {
  margin-inline-start: auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: inherit; font-size: 12.5px; font-weight: 500; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  min-height: 32px; transition: background-color .15s ease, transform .1s ease;
}
.lang:hover { background: var(--surface-2); }
.lang:active { transform: translateY(1px); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

/* Status */
.status { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
.status-text { display: grid; gap: 2px; }
.status-text b { font-size: 15.5px; font-weight: 600; }
.status-text span { color: var(--muted); font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--track-off); flex: none; position: relative; }
.on .dot { background: var(--accent); }
.on .dot::after {
  content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--accent);
  opacity: 0; animation: ping 2.4s cubic-bezier(.2,.7,.3,1) infinite;
}
@keyframes ping { 0% { transform: scale(.5); opacity: .55; } 80%, 100% { transform: scale(1.35); opacity: 0; } }

/* Switch */
.switch { display: block; margin-inline-start: auto; position: relative; width: 46px; height: 26px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--track-off); transition: background-color .2s ease; }
.switch .knob {
  position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--knob);
  box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .22s cubic-bezier(.3,1.4,.5,1);
}
.switch input:checked ~ .track { background: var(--accent); }
[dir="rtl"] .switch input:checked ~ .knob { transform: translateX(-20px); }
[dir="ltr"] .switch input:checked ~ .knob { transform: translateX(20px); }
.switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Try it */
.try { padding: 16px 18px 14px; display: grid; gap: 10px; }
.row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.row-head b { font-size: 14.5px; font-weight: 600; }
.hint { color: var(--muted); font-size: 12.5px; }
.hint code, .kbd {
  font-family: "Cascadia Mono", "Consolas", monospace; font-size: 12px; direction: ltr; unicode-bidi: isolate;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--ink);
}
textarea {
  width: 100%; height: 88px; resize: none; font: inherit; font-size: 17px; line-height: 1.6; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; user-select: text;
  transition: border-color .15s ease, box-shadow .15s ease;
}
textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fix {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 30px; font-size: 13px; color: var(--muted);
  opacity: 0; transform: translateY(4px); transition: opacity .25s ease, transform .25s ease;
}
.fix.show { opacity: 1; transform: none; }
.chip { border-radius: 999px; padding: 2px 10px; font-size: 13px; unicode-bidi: isolate; }
.chip.before { background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.chip.after { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.arrow { width: 16px; height: 16px; color: var(--muted); }
[dir="rtl"] .arrow { transform: scaleX(-1); }
.fix .undo { margin-inline-start: auto; }

/* Settings list */
.list { padding: 4px 0; }
.item { display: flex; align-items: center; gap: 14px; padding: 12px 18px; min-height: 60px; }
.item + .item { border-top: 1px solid var(--line); }
.ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); flex: none; }
.ico svg { width: 18px; height: 18px; }
.item-text { display: grid; gap: 1px; min-width: 0; }
.item-text b { font-weight: 500; font-size: 14px; }
.item-text span { color: var(--muted); font-size: 12.5px; }
.item > .end { margin-inline-start: auto; }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
.seg button {
  font: inherit; font-size: 12.5px; font-weight: 500; color: var(--muted); background: transparent; border: 0; border-radius: 7px;
  padding: 5px 11px; min-height: 30px; cursor: pointer; transition: background-color .15s ease, color .15s ease;
  white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.seg button:focus-visible, .btn:focus-visible, .lang:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.link {
  font: inherit; font-size: 12.5px; font-weight: 500; color: var(--accent-text); background: var(--accent-soft);
  border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 32px;
}

/* Footer */
.foot { display: flex; align-items: center; gap: 10px; padding: 2px 2px 0; }
.privacy { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; }
.privacy svg { width: 15px; height: 15px; flex: none; }
.btns { margin-inline-start: auto; display: flex; gap: 8px; }
.btn {
  font: inherit; font-size: 13px; font-weight: 500; border-radius: 9px; padding: 7px 14px; min-height: 34px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: background-color .15s ease, transform .1s ease;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }

.reveal { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.reveal:nth-child(2) { animation-delay: .04s; } .reveal:nth-child(3) { animation-delay: .08s; }
.reveal:nth-child(4) { animation-delay: .12s; } .reveal:nth-child(5) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top reveal">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#166534"/>
      <g fill="none" stroke="#04160c" stroke-width="3.2" stroke-linecap="square"><path d="M10 6.5h12M10 6.5v4M22 6.5v4M16 6.5v19M10 25.5h12M10 21.5v4M22 21.5v4"/></g>
      <g fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="square"><path d="M10 6.5h12M10 6.5v4M22 6.5v4M16 6.5v19M10 25.5h12M10 21.5v4M22 21.5v4"/></g>
    </svg>
    <div class="brand"><b data-t="name"></b><span data-t="tagline"></span></div>
    <button class="lang" id="lang" type="button"></button>
  </header>

  <section class="card status reveal" id="status">
    <span class="dot" aria-hidden="true"></span>
    <div class="status-text"><b id="statusTitle"></b><span id="statusSub"></span></div>
    <label class="switch"><input type="checkbox" id="enabled" role="switch"><span class="track"></span><span class="knob"></span></label>
  </section>

  <section class="card try reveal">
    <div class="row-head"><b data-t="tryTitle"></b><span class="hint" id="tryHint"></span></div>
    <textarea id="pad" dir="auto" spellcheck="false" autocomplete="off"></textarea>
    <div class="fix" id="fix" aria-live="polite">
      <span class="chip before" id="fixBefore" dir="auto"></span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span class="chip after" id="fixAfter" dir="auto"></span>
      <span class="undo hint" id="undoHint"></span>
    </div>
  </section>

  <section class="card list reveal">
    <div class="item">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M7.5 14h9"/></svg></span>
      <div class="item-text"><b data-t="layout"></b><span data-t="layoutSub"></span></div>
      <div class="end seg" id="layoutSeg" role="group"></div>
    </div>
    <div class="item">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg></span>
      <div class="item-text"><b data-t="sens"></b><span id="sensSub"></span></div>
      <div class="end seg" id="sensSeg" role="group"></div>
    </div>
    <div class="item">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/></svg></span>
      <div class="item-text"><b data-t="startup"></b><span data-t="startupSub"></span></div>
      <div class="end" id="startupEnd"></div>
    </div>
    <div class="item">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></span>
      <div class="item-text"><b data-t="shortcuts"></b><span id="shortcutsSub"></span></div>
    </div>
  </section>

  <footer class="foot reveal">
    <span class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg><span data-t="privacy"></span></span>
    <div class="btns">
      <button class="btn ghost" id="quit" type="button" data-t="quit"></button>
      <button class="btn" id="hide" type="button" data-t="hide"></button>
    </div>
  </footer>
</main>

<script>
const T = {
  ar: {
    name: "مُبَدِل", tagline: "يصلّح الكتابة بالكيبورد الغلط", langBtn: "English",
    onTitle: "شغّال", onSub: "بيراقب أول كلمة في أي خانة كتابة", offTitle: "متوقف", offSub: "مش هيصلّح أي حاجة لحد ما تشغّله",
    tryTitle: "جرّبه هنا", tryHint: "اكتب <code>hgsghl</code> وبعدين مسافة",
    undoHint: "<span class='kbd'>Alt+Z</span> للتراجع",
    layout: "تخطيط الكيبورد العربي", layoutSub: "اللي متضاف في ويندوز",
    sens: "الحساسية", sensSub: { conservative: "كلمات ٤ حروف أو أكتر", balanced: "كلمات ٣ حروف أو أكتر", aggressive: "حتى الكلمات القصيرة" },
    sensLabels: { conservative: "هادية", balanced: "متوازنة", aggressive: "سريعة" },
    startup: "التشغيل مع ويندوز", startupSub: "يفتح لوحده في الخلفية بعد تسجيل الدخول", startupOpen: "إعدادات بدء التشغيل",
    shortcuts: "اختصارات", shortcutsSub: "<span class='kbd'>Alt+Z</span> تراجع &nbsp; <span class='kbd'>Esc</span> إلغاء التصحيح",
    privacy: "أوفلاين بالكامل. مش بيحفظ اللي بتكتبه.", hide: "إخفاء", quit: "خروج",
    layoutNames: { "windows-101": "101", "windows-102": "102" }
  },
  en: {
    name: "Mubaddil", tagline: "Fixes text typed in the wrong keyboard layout", langBtn: "عربي",
    onTitle: "On", onSub: "Watching the first word in any text field", offTitle: "Paused", offSub: "Nothing gets fixed until you turn it on",
    tryTitle: "Try it", tryHint: "Type <code>hgsghl</code> then Space",
    undoHint: "<span class='kbd'>Alt+Z</span> to undo",
    layout: "Arabic keyboard layout", layoutSub: "The one added in Windows",
    sens: "Sensitivity", sensSub: { conservative: "Words of 4+ letters", balanced: "Words of 3+ letters", aggressive: "Short words too" },
    sensLabels: { conservative: "Careful", balanced: "Balanced", aggressive: "Fast" },
    startup: "Start with Windows", startupSub: "Runs in the background after you sign in", startupOpen: "Startup settings",
    shortcuts: "Shortcuts", shortcutsSub: "<span class='kbd'>Alt+Z</span> undo &nbsp; <span class='kbd'>Esc</span> cancel a fix",
    privacy: "Fully offline. Never stores what you type.", hide: "Hide", quit: "Quit",
    layoutNames: { "windows-101": "101", "windows-102": "102" }
  }
};
let S = null;
const $ = (id) => document.getElementById(id);
const api = () => window.pywebview && window.pywebview.api;

function seg(el, options, current, onPick) {
  el.innerHTML = "";
  for (const [value, label] of options) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", String(value === current));
    b.onclick = () => onPick(value);
    el.appendChild(b);
  }
}

function render() {
  if (!S) return;
  const t = T[S.lang] || T.ar;
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
  document.title = S.lang === "ar" ? "مُبَدِل — Mubaddil" : "Mubaddil — مُبَدِل";
  document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = t[n.dataset.t]; });
  $("lang").textContent = t.langBtn;
  $("enabled").setAttribute("aria-label", t.onTitle);
  $("tryHint").innerHTML = t.tryHint;
  $("pad").placeholder = "hgsghl";
  $("undoHint").innerHTML = t.undoHint;
  seg($("layoutSeg"), S.layouts.map((l) => [l.id, t.layoutNames[l.id] || l.label]), S.layout_id, (v) => update("set_layout", v));
  seg($("sensSeg"), ["conservative", "balanced", "aggressive"].map((k) => [k, t.sensLabels[k]]), S.sensitivity, (v) => update("set_sensitivity", v));
  $("sensSub").textContent = t.sensSub[S.sensitivity] || "";
  $("shortcutsSub").innerHTML = t.shortcutsSub;
  const end = $("startupEnd"); end.innerHTML = "";
  if (S.msix) {
    const b = document.createElement("button"); b.className = "link"; b.type = "button"; b.textContent = t.startupOpen;
    b.onclick = () => api().open_startup_settings(); end.appendChild(b);
  } else {
    end.innerHTML = '<label class="switch"><input type="checkbox" id="boot" role="switch"><span class="track"></span><span class="knob"></span></label>';
    $("boot").checked = S.start_with_windows; $("boot").setAttribute("aria-label", t.startup);
    $("boot").onchange = (e) => update("set_startup", e.target.checked);
  }
  renderLive();
}

function renderLive() {
  const t = T[S.lang] || T.ar;
  $("status").classList.toggle("on", S.enabled);
  $("enabled").checked = S.enabled;
  $("statusTitle").textContent = S.enabled ? t.onTitle : t.offTitle;
  $("statusSub").textContent = S.enabled ? t.onSub : t.offSub;
  const fix = S.last_fix;
  if (fix && fix.before) {
    $("fixBefore").textContent = fix.before.trim(); $("fixAfter").textContent = fix.after.trim();
    $("fix").classList.add("show");
  } else { $("fix").classList.remove("show"); }
}

async function update(method, value) { S = await api()[method](value); render(); }
async function refresh(full) {
  if (!api()) return;
  const next = await api().get_state();
  const langChanged = !S || S.lang !== next.lang;
  S = next;
  if (full || langChanged) render(); else renderLive();
}

$("enabled").onchange = (e) => update("set_enabled", e.target.checked);
$("lang").onclick = () => update("set_lang", S.lang === "ar" ? "en" : "ar");
$("hide").onclick = () => api().hide();
$("quit").onclick = () => api().quit();
window.addEventListener("pywebviewready", () => { refresh(true); $("pad").focus(); setInterval(() => refresh(false), 800); });
</script>
</body>
</html>
