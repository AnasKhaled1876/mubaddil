<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>إعدادات مبدّل</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body {
        width: auto;
        max-width: 520px;
        margin: 32px auto;
      }
    </style>
  </head>
  <body>
    <h1>إعدادات مبدّل</h1>
    <label>
      تخطيط الكيبورد
      <select id="layoutId"></select>
    </label>
    <label>
      الحساسية
      <select id="sensitivity">
        <option value="conservative">هادية — أقل غلط</option>
        <option value="balanced">متوازنة</option>
        <option value="aggressive">سريعة — تصلح أسرع</option>
      </select>
    </label>
    <label>
      وقفة التنبيه (مللي ثانية)
      <input id="pauseMs" type="number" min="200" max="2000" step="100" />
    </label>
    <label class="toggle">
      <input id="sessionRemap" type="checkbox" />
      <span>كمّل التحويل للكلمات اللي بعدها لحد ما تبدّل الكيبورد</span>
    </label>
    <p class="hint">
      ويندوز 101 هو الافتراضي في معظم العالم العربي. ماك عليه تخطيطين: Arabic - PC
      (زي ويندوز) وArabic الأصلي اللي قاعته مختلفة.
    </p>
    <script src="engine/layouts.js"></script>
    <script src="options.js"></script>
  </body>
</html>
